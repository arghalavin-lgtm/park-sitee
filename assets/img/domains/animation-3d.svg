<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="bg" cx=".5" cy=".35" r=".95"><stop offset="0" stop-color="#0e5b6e"/><stop offset=".55" stop-color="#08253a"/><stop offset="1" stop-color="#030c17"/></radialGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6f4ff"/><stop offset="1" stop-color="#3fd0e8"/></linearGradient>
